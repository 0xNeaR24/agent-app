<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rumah Agent</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1b1630;--wall:#2a2347;--wall2:#332a57;--floor:#4a3a2c;--floor2:#3d2f24;--ink:#f3eefc;--mut:#9d93c4;
--buy:#4ade80;--watch:#fbbf24;--avoid:#f87171;--line:#0e0a1c;--acc:#7dd3fc}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:12px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font-size:16px;letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge{font-size:10px;padding:3px 7px;border:2px solid var(--line);background:var(--wall2);color:var(--acc)}
.badge.demo{color:var(--watch)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--wall);border:3px solid var(--line);padding:8px;text-align:center}
.sum b{display:block;font-size:15px;margin-top:2px}
.up{color:var(--buy)}.dn{color:var(--avoid)}
.house{border:4px solid var(--line);background:var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px;box-shadow:0 0 0 3px #5b4a8a}
.roof{height:22px;background:repeating-linear-gradient(90deg,#8b3a4a 0 16px,#a14658 16px 32px);border:4px solid var(--line);border-bottom:0;margin:0 -4px}
.room{background:linear-gradient(var(--wall) 0 62%,var(--floor) 62% 100%);position:relative;padding:8px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.room:nth-child(4n+2),.room:nth-child(4n+3){background:linear-gradient(var(--wall2) 0 62%,var(--floor2) 62% 100%)}
.room h2{position:absolute;top:6px;left:8px;font-size:10px;color:var(--mut);text-transform:uppercase}
.pill{font-size:10px;padding:2px 7px;border:2px solid var(--line);background:#14102a;margin-top:4px;max-width:100%;text-align:center}
.pill.working{color:var(--buy)}.pill.alert{color:var(--avoid)}.pill.waiting,.pill.idle{color:var(--mut)}
.msg{font-size:10px;color:var(--ink);margin-top:3px;text-align:center;min-height:28px}
.bot{width:56px;height:56px;image-rendering:pixelated;shape-rendering:crispEdges}
.bot.working{animation:bob .6s steps(2) infinite}
.bot.alert{animation:shake .25s steps(2) infinite}
.bot.idle{animation:bob 1.6s steps(2) infinite}
.bot.waiting{animation:bob 2.4s steps(2) infinite;opacity:.8}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shake{50%{transform:translateX(3px)}}
.eye{animation:blink 3.2s steps(1) infinite}
@keyframes blink{95%{opacity:0}}
h3{font-size:12px;margin:16px 0 6px;color:var(--mut);text-transform:uppercase}
.card{background:var(--wall);border:3px solid var(--line);padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card small{color:var(--mut);display:block}
.tag{font-weight:bold;padding:2px 6px;border:2px solid var(--line);color:#111}
.tag.BUY{background:var(--buy)}.tag.WATCH{background:var(--watch)}.tag.AVOID{background:var(--avoid)}
.bub{position:relative;background:#f3eefc;color:#1b1630;border:3px solid var(--line);padding:4px 6px;font-size:10px;line-height:1.3;margin-bottom:8px;max-width:100%;text-align:left}
.bub:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--line)}
.rapat{background:var(--wall);border:3px solid var(--line);padding:8px 10px;margin-bottom:6px}
.rapat p{margin:3px 0}
.empty{color:var(--mut);padding:8px 0}
.foot{margin-top:16px;color:var(--mut);font-size:10px}
</style>
</head>
<body>
<div class="top"><h1>🏠 RUMAH AGENT</h1><span id="badge" class="badge">...</span></div>
<div class="sum">
  <div>Ekuitas<b id="eq">-</b></div><div>Kas<b id="cash">-</b></div><div>PnL<b id="pnl">-</b></div>
</div>
<div class="roof"></div>
<div class="house" id="house"></div>
<div id="rapatwrap"></div>
<h3>Posisi simulasi</h3><div id="pos"></div>
<h3>Aset dipantau</h3><div id="tok"></div>
<p class="foot" id="foot"></p>
<script>
const BOT=[
"....kkkkkk....",
"...kBBBBBBk...",
"..kBBBBBBBBk..",
"..kBwwBBwwBk..",
"..kBwEBBwEBk..",
"..kBBBBBBBBk..",
"..kBBkkkkBBk..",
"...kBBBBBBk...",
"....kkkkkk....",
"...kCCCCCCk...",
"..kCCCCCCCCk..",
"..kCCCCCCCCk..",
"...kkCkkCkk...",
"...kk....kk..."];
const ROOMS=[
 ["price","Harga","#38bdf8","#0ea5e9"],
 ["safety","Keamanan","#f87171","#dc2626"],
 ["analyst","Analis","#a78bfa","#7c3aed"],
 ["wallet","Dompet","#fbbf24","#d97706"],
 ["trader","Trader","#4ade80","#16a34a"],
 ["ledger","Pembukuan","#f472b6","#db2777"]];
function bot(c1,c2,mood){
  const col={k:"#0e0a1c",B:c1,C:c2,w:"#fff",E:mood==="alert"?"#ef4444":"#0e0a1c"};
  let r="";
  BOT.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if(ch==="."||!col[ch])return;
    r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${col[ch]}"${ch==="E"?' class="eye"':''}/>`;}));
  return `<svg class="bot ${mood}" viewBox="0 0 14 14">${r}</svg>`;
}
const fmt=n=>n>=1000?"$"+n.toLocaleString("en-US",{maximumFractionDigits:0}):"$"+(+n).toPrecision(4).replace(/\.?0+$/,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const DEMO={v:3,t:0,mode:"paper",eq:1042.5,cash:700,pnl:4.25,
 pos:[["NEAR",5.1,5.4,5.9,342.5]],
 tok:[["BNB","WATCH",68,612.3,95,0,9e8,1.2],["NEAR","BUY",78,5.4,95,0,2e8,3.1],["PI","AVOID",41,0.21,90,0,1e7,-6.2]],
 chat:{sym:"NEAR",v:"SETUJU",l:[["price","NEAR naik 3% dengan volume sehat."],["safety","Aset utama, tidak ada bendera merah."],["analyst","Skor 78, saya condong BUY."],["trader","Oke, beli kecil saja."]]},
 ag:{price:["working","3/3 aset terpantau"],safety:["working","Tidak ada bendera merah"],
 analyst:["working","1 BUY | 1 WATCH | 1 AVOID"],wallet:["idle","Saldo 0.00000 ETH"],
 trader:["working","1 posisi | PnL +4.3%"],ledger:["idle","Ekuitas $1,043"]}};
async function decode(s){
  const b=s.replace(/-/g,"+").replace(/_/g,"/");
  const bin=atob(b+"=".repeat((4-b.length%4)%4));
  const u=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const ds=new DecompressionStream("deflate");
  const w=ds.writable.getWriter();w.write(u);w.close();
  return JSON.parse(await new Response(ds.readable).text());
}
function render(d,demo){
  try{const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}}catch(e){}
  const bd=$("badge");bd.textContent=demo?"DEMO":"SIMULASI";bd.className="badge"+(demo?" demo":"");
  const sg=(n,p)=>(n>=0?"+":"")+n.toFixed(2)+(p?"%":"");
  $("eq").textContent=fmt(d.eq);$("cash").textContent=fmt(d.cash);
  $("pnl").textContent=sg(d.pnl,1);$("pnl").className=d.pnl>=0?"up":"dn";
  $("house").innerHTML=ROOMS.map(([k,name,c1,c2])=>{
    const [mood,txt]=(d.ag||{})[k]||["waiting","menunggu data"];
    const lbl={working:"BEKERJA",alert:"WASPADA",idle:"SANTAI",waiting:"MENUNGGU"}[mood]||"MENUNGGU";
    const say=((d.chat&&d.chat.l)||[]).find(x=>x[0]===k);
    return `<div class="room"><h2>${name}</h2>${say?`<div class="bub">${esc(say[1])}</div>`:""}${bot(c1,c2,mood)}<span class="pill ${mood}">${lbl}</span><div class="msg">${esc(txt)}</div></div>`;}).join("");
  const nm={price:"Harga",safety:"Keamanan",analyst:"Analis",trader:"Trader"};
  $("rapatwrap").innerHTML=d.chat?`<h3>Rapat agen: ${esc(d.chat.sym)}</h3><div class="rapat">${d.chat.l.map(x=>`<p><b>${nm[x[0]]||x[0]}:</b> ${esc(x[1])}</p>`).join("")}<p><b>${d.chat.v==="SETUJU"?"✅ Disetujui":"⛔ Ditolak"}</b></p></div>`:"";
  $("pos").innerHTML=(d.pos||[]).length?d.pos.map(p=>`<div class="card"><div><b>${esc(p[0])}</b><small>masuk ${p[1]} → ${p[2]}</small></div><div class="${p[3]>=0?"up":"dn"}">${sg(p[3],1)}<small>${fmt(p[4])}</small></div></div>`).join(""):'<div class="empty">Belum ada posisi terbuka.</div>';
  $("tok").innerHTML=(d.tok||[]).length?d.tok.map(t=>`<div class="card"><div><b>${esc(t[0])}</b><small>${fmt(t[3])} · 24j ${t[7]>=0?"+":""}${t[7]}%${t[4]>=0?" · aman "+t[4]:""}</small></div><span class="tag ${esc(t[1])}">${esc(t[1])} ${t[2]}</span></div>`).join(""):'<div class="empty">Belum ada data. Tunggu siklus pertama bot lalu ketik /app lagi.</div>';
  $("foot").textContent=(demo?"Data contoh. Buka lewat /app di bot untuk data asli. ":"Update: "+new Date(d.t*1000).toLocaleString("id-ID")+". Ketik /app lagi untuk menyegarkan. ")+"Simulasi uang virtual, bukan nasihat finansial.";
}
(async()=>{
  const s=new URLSearchParams(location.search).get("s");
  try{ if(s) return render(await decode(s),false); }catch(e){}
  render(DEMO,true);
})();
</script>
</body>
</html>
